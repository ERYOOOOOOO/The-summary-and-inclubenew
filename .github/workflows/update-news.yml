name: Update news

on:
  schedule:
    # 01:00 UTC = 08:00 Bangkok, every day.
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Collect news
        env:
          # Optional. Add it under Settings → Secrets and variables → Actions
          # if you have a Facebook Page access token. Without it the Facebook
          # sources are skipped and the rest still run.
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
        run: node scripts/aggregate.mjs

      - name: Commit if anything changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- data/news.json; then
            echo 'No news changes.'
          else
            git add data/news.json
            git commit -m "chore: refresh news $(date -u +%Y-%m-%d)"
            git push
          fi
